<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Welcome!</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px;">
    <h2>Welcome to {{fromName}}!</h2>
    <p>Hi {{firstName}},</p>
    <p>Welcome to our store! Your account has been successfully created and verified.</p>
    <p>You can now:</p>
    <ul>
        <li>Browse our products</li>
        <li>Add items to your cart</li>
        <li>Place orders</li>
        <li>Track your purchases</li>
    </ul>
    <div style="text-align: center; margin: 30px 0;">
        <a href="{{loginUrl}}" style="background-color: #28a745; color: white; padding: 12px 30px; text-decoration: none; border-radius: 5px; display: inline-block;">Start Shopping</a>
    </div>
    <hr>
    <p><small>Need help? Contact us at {{supportEmail}}</small></p>
</body>
</html>
